[package]
name = "gridcraft-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "wasm-bindgen bridge exposing the GridCraft engine to the mobile web app"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same pinned upstream commit as rust/Cargo.toml (the iOS bridge); bump both together.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "d9d09f0baa912e88c5111107903fc8c640214b57" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
