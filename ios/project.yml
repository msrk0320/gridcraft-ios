name: GridCraft
options:
  bundleIdPrefix: com.madsrei
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GridCraft:
    type: application
    platform: iOS
    sources:
      - GridCraft
      - Generated/gridcraft_ffi.swift
    dependencies:
      # Built by scripts/build-rust-ios.sh: the Rust engine as a static library plus its C header.
      - framework: Generated/GridCraftFFI.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GridCraft
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madsrei.gridcraft
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
