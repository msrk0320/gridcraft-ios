[package]
name = "gridcraft-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "UniFFI bridge exposing the GridCraft engine to the iOS app"

[lib]
name = "gridcraft_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
# Pinned upstream commit; bump `rev` to pull in engine updates.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "d9d09f0baa912e88c5111107903fc8c640214b57" }
uniffi = "0.32"
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
