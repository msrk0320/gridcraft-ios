name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/rust
      - name: Test
        run: cargo test
        working-directory: web/rust
      - name: Install wasm-bindgen (version from Cargo.lock)
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' web/rust/Cargo.lock | grep version | cut -d '"' -f2)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "$PWD/wasm-bindgen-${version}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build
        run: bash scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
